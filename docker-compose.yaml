services:
  postgres:
    container_name: postgres
    image: postgres:17.2
    env_file:
      - ./configs/postgres.env
    volumes:
      - pvz_pg_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml

  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./configs/api.env
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
      - "3000:3000"
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      prometheus:
        condition: service_started

volumes:
  pvz_pg_data:
